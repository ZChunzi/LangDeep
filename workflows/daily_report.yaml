id: "daily_report"
name: "每日汇报生成"
description: "生成包含搜索和总结的每日报告"
steps:
  - id: "task_collect"
    name: "收集信息"
    agent: "web_research_agent"
    depends_on: []
    config:
      query: "{{ user_input }}"
    priority: 1
    status: "pending"

  - id: "task_summarize"
    name: "总结信息"
    agent: "default_agent"
    depends_on: ["task_collect"]
    priority: 2
    status: "pending"
