name: Documentation improvement
description: Improve docs, examples, or guides.
title: "[Docs]: "
labels: ["type: docs", "area: docs"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: Which documentation is confusing, missing, or outdated?
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 目标
      description: What should be easier to understand after this change?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 需要修改的文件
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
    validations:
      required: true
