name: Feature request
description: Suggest a new feature or improvement
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题背景
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 方案建议
      description: What should be changed or added?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - orchestrator
        - planner
        - executor
        - aggregator
        - provider
        - agent-builder
        - memory
        - cache
        - sandbox
        - observability
        - docs
        - examples
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 替代方案

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / 验收标准
      description: How do we know this is done?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context / 补充信息
