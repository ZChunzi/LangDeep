[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langdeep"
version = "2.0.12"
description = "LangChain + LangGraph Agent Workflow Framework"
readme = "README.md"
license = "MIT"
authors = [
    {name = "ZChunzi", email = "rzhou990@gmail.com"}
]
keywords = ["langchain", "langgraph", "agent", "orchestration", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
azure-openai = ["langchain-openai>=0.2.0"]
deepseek = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic"]
google-genai = ["langchain-google-genai"]
vertexai = ["langchain-google-vertexai"]
ollama = ["langchain-ollama"]
all = [
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-google-vertexai",
    "langchain-ollama",
    "langchain-tavily",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/ZChunzi/LangDeep"

[tool.setuptools]
package-dir = {"langdeep" = "src"}
packages = [
    "langdeep",
    "langdeep.core",
    "langdeep.core.decorators",
    "langdeep.core.registry",
    "langdeep.core.tools",
    "langdeep.core.agent_builder",
    "langdeep.core.orchestrator",
    "langdeep.core.planner",
    "langdeep.core.prompt",
    "langdeep.core.scheduling",
    "langdeep.core.execution",
    "langdeep.core.coordination",
    "langdeep.core.memory",
    "langdeep.core.cache",
    "langdeep.core.im",
    "langdeep.core.adapters",
    "langdeep.core.sandbox",
    "langdeep.core.process",
    "langdeep.core.secrets",
    "langdeep.core.observability",
    "langdeep.resources",
    "langdeep.resources.prompts",
    "langdeep.schemas",
    "langdeep.utils",
]
include-package-data = true

[tool.setuptools.package-data]
"langdeep.resources.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# v1.2.4 keeps correctness-focused lint gates that catch syntax/name
# errors without forcing a full historical style cleanup in the same release.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
